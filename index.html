<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สำหรับ ที่รัก💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;600&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Prompt', 'Mitr', sans-serif;
            background-color: #08030d;
            color: #fff;
        }

        /* Ambient background glow */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(255, 20, 147, 0.15) 0%, rgba(139, 0, 0, 0.05) 50%, rgba(8, 3, 13, 1) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Floating sparkles background */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Container Pages */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
            text-align: center;
        }

        .page.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        /* Page 1: Question */
        .question-title {
            font-size: 2.2rem;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6),
                         0 0 20px rgba(255, 105, 180, 0.4);
            margin-bottom: 50px;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        .neon-btn {
            background: transparent;
            color: #ffb6c1;
            font-family: 'Prompt', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            padding: 18px 45px;
            border: 3px solid #ff1493;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.6),
                        inset 0 0 15px rgba(255, 20, 147, 0.4);
            text-shadow: 0 0 8px #ff1493;
        }

        .neon-btn:hover {
            color: #ffffff;
            background: rgba(255, 20, 147, 0.25);
            border-color: #ff69b4;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.9),
                        0 0 50px rgba(255, 105, 180, 0.7),
                        inset 0 0 20px rgba(255, 20, 147, 0.6);
            transform: translateY(-3px) scale(1.03);
            text-shadow: 0 0 12px #ffffff, 0 0 20px #ff1493;
        }

        .neon-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Page 2: Heart Showcase */
        #heart-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Heart Animation Item */
        .heart-text-item {
            position: absolute;
            font-size: 1.25rem;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.3);
            transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.27);
            pointer-events: none;
        }

        .heart-text-item.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Color classes with neon glow */
        .color-pink {
            color: #ff69b4;
            text-shadow: 0 0 8px #ff69b4, 0 0 18px #ff1493;
        }

        .color-red {
            color: #ff3366;
            text-shadow: 0 0 8px #ff3366, 0 0 18px #cc0033;
        }

        .color-white {
            color: #ffffff;
            text-shadow: 0 0 8px #ffffff, 0 0 18px #ffb6c1;
        }

        /* Pulse effect for heart container after completion */
        @keyframes heartPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .pulse-heart {
            animation: heartPulse 2.8s ease-in-out infinite;
        }

        /* Music toggle button */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 105, 180, 0.3);
            color: #ffb6c1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .music-btn:hover {
            background: rgba(255, 20, 147, 0.2);
            color: #fff;
            box-shadow: 0 0 12px rgba(255, 20, 147, 0.5);
        }

        @media (max-width: 600px) {
            .question-title {
                font-size: 1.6rem;
                margin-bottom: 40px;
            }
            .neon-btn {
                font-size: 1.25rem;
                padding: 15px 35px;
            }
            .heart-text-item {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <canvas id="particles-canvas"></canvas>

    <!-- Music Control Button -->
    <button class="music-btn" id="music-toggle" title="เปิด/ปิดเพลง">
        <svg id="music-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
        </svg>
    </button>

    <!-- Page 1: Question -->
    <div class="page" id="page-1">
        <h1 class="question-title">วันนี้อยากดูอะไรไหม? 💕</h1>
        <button class="neon-btn" id="start-btn">กดตรงนี้เลย</button>
    </div>

    <!-- Page 2: Heart Animation -->
    <div class="page hidden" id="page-2">
        <div id="heart-container"></div>
    </div>

    <!-- Embedded Romantic BGM -->
    <audio id="bgm" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Config & State
        const NAME = "love";
        const COLORS = ['color-pink', 'color-red', 'color-white'];
        
        let audioContext = null;
        let isMusicPlaying = false;
        let synthInterval = null;

        const bgm = document.getElementById('bgm');
        const musicToggle = document.getElementById('music-toggle');
        const startBtn = document.getElementById('start-btn');
        const page1 = document.getElementById('page-1');
        const page2 = document.getElementById('page-2');
        const heartContainer = document.getElementById('heart-container');

        // Particle Canvas Background
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = -(Math.random() * 0.5 + 0.1);
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.color = ['#ff69b4', '#ff3366', '#ffffff'][Math.floor(Math.random() * 3)];
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y < 0) this.reset();
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Music System
        function playMusic() {
            bgm.volume = 0.5;
            const playPromise = bgm.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isMusicPlaying = true;
                    updateMusicIcon(true);
                }).catch(() => {
                    // Fallback to Synth music box if external audio is blocked
                    startSynthMusic();
                    isMusicPlaying = true;
                    updateMusicIcon(true);
                });
            }
        }

        function toggleMusic() {
            if (isMusicPlaying) {
                bgm.pause();
                stopSynthMusic();
                isMusicPlaying = false;
                updateMusicIcon(false);
            } else {
                playMusic();
            }
        }

        function updateMusicIcon(playing) {
            musicToggle.style.opacity = playing ? "1" : "0.5";
            musicToggle.style.borderColor = playing ? "rgba(255, 20, 147, 0.8)" : "rgba(255, 255, 255, 0.3)";
        }

        musicToggle.addEventListener('click', toggleMusic);

        // Synth Music Box Backup (In case MP3 URL fails)
        function startSynthMusic() {
            if (synthInterval) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 329.63, 293.66];
            let noteIdx = 0;

            synthInterval = setInterval(() => {
                if (!audioContext || audioContext.state === 'closed') return;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(notes[noteIdx % notes.length], audioContext.currentTime);
                gain.gain.setValueAtTime(0.08, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 1.2);
                noteIdx++;
            }, 600);
        }

        function stopSynthMusic() {
            if (synthInterval) {
                clearInterval(synthInterval);
                synthInterval = null;
            }
        }

        // Heart Points Generation (Outline Only)
        function generateHeartPoints() {
            const points = [];
            const isMobile = window.innerWidth < 600;
            const scaleFactor = isMobile ? 12 : 18;
            
            // Generate heart outline curve points
            const totalItems = isMobile ? 32 : 44;
            for (let i = 0; i < totalItems; i++) {
                const t = (i / totalItems) * Math.PI * 2;
                // Standard Parametric Heart Formula
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                points.push({
                    x: x * scaleFactor,
                    y: y * scaleFactor
                });
            }
            return points;
        }

        // Start Heart Display Animation
        function startHeartAnimation() {
            page1.classList.add('hidden');
            page2.classList.remove('hidden');

            const points = generateHeartPoints();
            heartContainer.innerHTML = '';

            points.forEach((pt, idx) => {
                const item = document.createElement('div');
                item.className = `heart-text-item ${COLORS[Math.floor(Math.random() * COLORS.length)]}`;
                item.textContent = NAME;
                
                // Position relative to screen center
                item.style.left = `calc(50% + ${pt.x}px)`;
                item.style.top = `calc(50% + ${pt.y}px)`;

                heartContainer.appendChild(item);

                // Sequential appearance
                setTimeout(() => {
                    item.classList.add('visible');
                }, idx * 120);
            });

            // Start pulse effect when finished
            const totalDuration = points.length * 120 + 600;
            setTimeout(() => {
                heartContainer.classList.add('pulse-heart');
            }, totalDuration);
        }

        // Button Click Event
        startBtn.addEventListener('click', () => {
            playMusic();
            startHeartAnimation();
        });

        // Window resize update for heart
        window.addEventListener('resize', () => {
            if (!page2.classList.contains('hidden')) {
                const points = generateHeartPoints();
                const items = heartContainer.querySelectorAll('.heart-text-item');
                items.forEach((item, idx) => {
                    if (points[idx]) {
                        item.style.left = `calc(50% + ${points[idx].x}px)`;
                        item.style.top = `calc(50% + ${points[idx].y}px)`;
                    }
                });
            }
        });
    </script>
</body>
</html>
